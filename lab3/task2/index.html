<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <h1 class="header__title">ToDo List</h1>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <section class="card" aria-label="ToDo application">
          <h2 class="card__title">ToDo List</h2>

          <form class="todo-form" id="todoForm" autocomplete="off">
            <label class="todo-form__label" for="taskInput">New task</label>

            <div class="todo-form__row">
              <input
                class="todo-form__input"
                id="taskInput"
                name="task"
                type="text"
                placeholder="New Task"
                aria-label="Task text"
                required
              />
              <button class="btn btn--primary" type="submit">Add</button>
            </div>
          </form>

          <ul class="todo-list" id="todoList" aria-label="Tasks list"></ul>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
